<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Lista de Clientes</title>
</head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-person-raised-hand me-2 text-primary"></i>Clientes
        </h2>
        <a href="/clientes/novo" class="btn btn-primary" sec:authorize="hasRole('ATENDENTE')">
            <i class="bi bi-plus-lg me-1"></i> Novo Cliente
        </a>
    </div>

    <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div id="mensagemAcao" class="alert alert-danger d-none" role="alert"></div>

    <div class="toast-container position-fixed top-0 end-0 p-3" th:if="${toast}">
        <div id="toastTermos" class="toast align-items-center text-bg-success border-0" role="status"
             aria-live="polite" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                    <i class="bi bi-envelope-check me-2"></i><span th:text="${toast}"></span>
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>Nome</th>
                        <th>Telefone</th>
                        <th>Endereço</th>
                        <th>Situação</th>
                        <th class="text-end pe-4">Ações</th>
                    </tr>
                </thead>
                <tbody id="clientes-tabela"></tbody>
            </table>
        </div>
    </div>

    <script th:inline="javascript">
        const podeEditar = [[${#authorization.expression('hasRole(''ATENDENTE'')')}]];
        const podeInativar = [[${#authorization.expression('hasRole(''GERENTE'')')}]];
        const API_URL = '/api/clientes';
        const tabelaClientes = document.getElementById('clientes-tabela');

        function escaparHtml(texto) {
            const area = document.createElement('div');
            area.textContent = texto ?? '';
            return area.innerHTML;
        }

        function formatarEndereco(cliente) {
            const partes = [
                cliente.logradouro,
                cliente.numero,
                cliente.complemento,
                cliente.bairro,
                cliente.cidade,
                cliente.estado
            ].filter(p => p && p.trim() !== '');

            return partes.length > 0 ? partes.join(', ') : (cliente.endereco || '—');
        }

        function montarAcoes(cliente) {
            const ativo = cliente.ativo !== false;
            const botoes = [];
            if (podeEditar && ativo) {
                botoes.push(`<a href="/clientes/editar/${cliente.id}" class="btn btn-sm btn-outline-primary me-1">
                    <i class="bi bi-pencil-fill"></i> Editar</a>`);
            }
            if (podeInativar && ativo) {
                botoes.push(`<button class="btn btn-sm btn-outline-danger" onclick="inativarCliente('${cliente.id}')">
                    <i class="bi bi-person-x-fill"></i> Inativar</button>`);
            }
            return botoes.join('');
        }

        function montarSituacao(cliente) {
            if (cliente.ativo !== false) {
                return '<span class="badge bg-success">Ativo</span>';
            }
            const ate = cliente.retidoAte ? cliente.retidoAte.substring(0, 10) : '';
            return `<span class="badge bg-secondary">Inativo</span><div class="small text-muted">retido até ${escaparHtml(ate)}</div>`;
        }

        async function carregarClientes() {
            const response = await fetch(API_URL);
            const clientes = await response.json();
            tabelaClientes.innerHTML = '';

            if (clientes.length === 0) {
                tabelaClientes.innerHTML = `
                    <tr>
                        <td colspan="5" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum cliente cadastrado.
                        </td>
                    </tr>`;
                return;
            }

            clientes.forEach(cliente => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${escaparHtml(cliente.nome) || '—'}</td>
                    <td>${escaparHtml(cliente.telefone) || '—'}</td>
                    <td>${escaparHtml(formatarEndereco(cliente))}</td>
                    <td>${montarSituacao(cliente)}</td>
                    <td class="text-end pe-4 text-nowrap">${montarAcoes(cliente)}</td>
                `;
                tabelaClientes.appendChild(row);
            });
        }

        async function inativarCliente(id) {
            const aviso = 'O cadastro será apenas inativado e permanecerão armazenadas por 1 ano apenas as informações relativas aos pedidos feitos. Confirmar?';
            if (!confirm(aviso)) {
                return;
            }
            try {
                await enviarJson(`${API_URL}/${id}/inativar`, {});
                carregarClientes();
            } catch (erro) {
                exibirErro(erro.message);
            }
        }

        carregarClientes();

        document.addEventListener('DOMContentLoaded', () => {
            const elemento = document.getElementById('toastTermos');
            if (elemento) {
                new bootstrap.Toast(elemento, { delay: 6000 }).show();
            }
        });
    </script>
</div>
</body>
</html>
