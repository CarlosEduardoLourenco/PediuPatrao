<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Horário de Funcionamento</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-clock me-2 text-primary"></i>Horário de Funcionamento
        </h2>
        <span class="badge fs-6" th:classappend="${situacao.aberto()} ? 'bg-success' : 'bg-secondary'"
              th:text="${situacao.mensagem()}"></span>
    </div>

    <div id="mensagemAcao" class="alert alert-danger d-none" role="alert"></div>
    <div id="mensagemSucesso" class="alert alert-success d-none" role="alert">Horários salvos com sucesso.</div>

    <div class="card shadow-sm" style="max-width: 720px;">
        <div class="card-body p-0">
            <table class="table align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">Dia</th>
                        <th>Atende</th>
                        <th>Abre</th>
                        <th>Fecha</th>
                    </tr>
                </thead>
                <tbody id="grade">
                    <tr th:each="horario : ${horarios}" th:attr="data-dia=${horario.diaDaSemana}">
                        <td class="ps-4 fw-medium"
                            th:text="${#strings.capitalize(horario.diaDaSemana.getDisplayName(T(java.time.format.TextStyle).FULL, new java.util.Locale('pt', 'BR')))}"></td>
                        <td>
                            <input type="checkbox" class="form-check-input atende" th:checked="${horario.aberto}"
                                   sec:authorize="hasRole('GERENTE')">
                            <span sec:authorize="!hasRole('GERENTE')" th:text="${horario.aberto} ? 'Sim' : 'Não'"></span>
                        </td>
                        <td>
                            <input type="time" class="form-control abertura" th:value="${horario.abertura}"
                                   sec:authorize="hasRole('GERENTE')">
                            <span sec:authorize="!hasRole('GERENTE')" th:text="${horario.abertura ?: '—'}"></span>
                        </td>
                        <td>
                            <input type="time" class="form-control fechamento" th:value="${horario.fechamento}"
                                   sec:authorize="hasRole('GERENTE')">
                            <span sec:authorize="!hasRole('GERENTE')" th:text="${horario.fechamento ?: '—'}"></span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer d-flex justify-content-between align-items-center" sec:authorize="hasRole('GERENTE')">
            <span class="text-muted small">Se o fechamento for antes da abertura, o atendimento passa da meia-noite.</span>
            <button type="button" class="btn btn-primary" id="salvarHorarios">
                <i class="bi bi-check-lg me-1"></i>Salvar horários
            </button>
        </div>
    </div>

    <script>
        function coletarGrade() {
            return Array.from(document.querySelectorAll('#grade tr')).map(linha => {
                const aberto = linha.querySelector('.atende').checked;
                return {
                    diaDaSemana: linha.dataset.dia,
                    aberto,
                    abertura: aberto ? linha.querySelector('.abertura').value || null : null,
                    fechamento: aberto ? linha.querySelector('.fechamento').value || null : null
                };
            });
        }

        async function salvarHorarios() {
            document.getElementById('mensagemAcao').classList.add('d-none');
            document.getElementById('mensagemSucesso').classList.add('d-none');
            try {
                await enviarJson('/api/horarios', coletarGrade(), 'PUT');
                document.getElementById('mensagemSucesso').classList.remove('d-none');
            } catch (erro) {
                exibirErro(erro.message);
            }
        }

        document.getElementById('salvarHorarios')?.addEventListener('click', salvarHorarios);
    </script>

</div>

</body>
</html>
