<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Produtos</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-boxes me-2 text-primary"></i>Produtos
        </h2>
        <a href="/produtos/novo" class="btn btn-primary" sec:authorize="hasRole('GERENTE')">
            <i class="bi bi-plus-lg me-1"></i> Novo Produto
        </a>
    </div>

    <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">Nome</th>
                        <th>Tipo</th>
                        <th class="text-end">Preço</th>
                        <th>Situação</th>
                        <th class="text-end pe-4" sec:authorize="hasRole('GERENTE')">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(produtos)}">
                        <td colspan="5" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum produto cadastrado.
                        </td>
                    </tr>
                    <tr th:each="produto : ${produtos}">
                        <td class="ps-4" th:text="${produto.nome}"></td>
                        <td th:text="${produto.tipo}"></td>
                        <td class="text-end"
                            th:text="'R$ ' + ${#numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA')}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${produto.ativo == true} ? 'bg-success' : 'bg-secondary'"
                                  th:text="${produto.ativo == true} ? 'Ativo' : 'Inativo'"></span>
                        </td>
                        <td class="text-end pe-4 text-nowrap" sec:authorize="hasRole('GERENTE')">
                            <a th:href="@{/produtos/editar/{id}(id=${produto.id})}"
                               class="btn btn-sm btn-outline-primary me-1">
                                <i class="bi bi-pencil-fill"></i> Editar
                            </a>
                            <form th:action="@{/produtos/alternar/{id}(id=${produto.id})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-secondary me-1"
                                        th:text="${produto.ativo == true} ? 'Inativar' : 'Ativar'"></button>
                            </form>
                            <form th:action="@{/produtos/deletar/{id}(id=${produto.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Deseja realmente excluir este produto?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash-fill"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

</body>
</html>
